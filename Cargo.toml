[workspace]
resolver = "2"
members = ["crates/core", "crates/shim"]

# Speed over size: the frame loop and the rubble run in this module sixty
# times a second.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The core's tests simulate whole chases; unoptimised integer maths makes
# them slow enough to stop being run.
[profile.test]
opt-level = 2
